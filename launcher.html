<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Launcher Pomodoro</title>
</head>
<body>
  <h1>Controlador del Pomodoro 🍅</h1>
  <button onclick="abrirPomodoro()">Abrir ventana flotante</button>

  <script>
    let pomodoroWindow;

    function abrirPomodoro() {
      if (!pomodoroWindow || pomodoroWindow.closed) {
        pomodoroWindow = window.open(
          "index.html",
          "PomodoroFlotante",
          "width=460,height=1000px,left=100,top=100,resizable=no"
        );
      } else {
        pomodoroWindow.focus();
      }
    }
  </script>
</body>
</html>
